<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" rotation="0 0 0" color="#FFFF00"></a-box>
      <a-box position="3 0.5 -3" rotation="0 0 0" color="#FFFF00"></a-box>
      <a-sphere position="-1 3 -3" radius="0.75" color="#FFFFBD"></a-sphere>
      <a-sphere position="3 3 -3" radius="0.75" color="#FFFFBD"></a-sphere>
      <a-cylinder position="-1 1.5 -3" rotation="0 0 0" radius="0.5" height="2" color="#FFFFBD"></a-cylinder>
      <a-cylinder position="-1 4 -3" rotation="0 0 0" radius="0.5" height="2" color="#FFFFBD"></a-cylinder>
      <a-cylinder position="3 1.5 -3" rotation="0 0 0" radius="0.5" height="2" color="#FFFFBD"></a-cylinder>
      <a-cylinder position="3 4 -3" rotation="0 0 0" radius="0.5" height="2" color="#FFFFBD"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="8" height="6" color="#A66B00"></a-plane>
      <a-sky color="#FF05BD"></a-sky>
    </a-scene>
  </body>
</html>
